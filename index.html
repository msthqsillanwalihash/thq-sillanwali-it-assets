<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="THQ Sillanwali IT Asset Management System">
<title>THQ Sillanwali — IT Asset Management</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%230d9488' rx='20' width='100' height='100'/%3E%3Ctext x='50' y='68' font-size='48' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EIT%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script defer src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">IT</div>
    <h1>THQ Hospital Sillanwali</h1>
    <div class="sub">IT Asset Management System</div>
    <div class="pin-display" id="pinDisplay">••••</div>
    <div class="login-error" id="loginError"></div>
    <div class="pin-pad">
      <button type="button" onclick="pinPress('1')">1</button>
      <button type="button" onclick="pinPress('2')">2</button>
      <button type="button" onclick="pinPress('3')">3</button>
      <button type="button" onclick="pinPress('4')">4</button>
      <button type="button" onclick="pinPress('5')">5</button>
      <button type="button" onclick="pinPress('6')">6</button>
      <button type="button" onclick="pinPress('7')">7</button>
      <button type="button" onclick="pinPress('8')">8</button>
      <button type="button" onclick="pinPress('9')">9</button>
      <button type="button" class="pin-action" onclick="pinClear()">Clear</button>
      <button type="button" onclick="pinPress('0')">0</button>
      <button type="button" class="pin-ok" onclick="pinSubmit()">OK</button>
    </div>
    <div class="login-hint">Admin PIN: 786 · Staff PIN: 1234</div>
  </div>
</div>
<script src="app1.js"></script>
<script src="app2.js"></script>
<script src="app3.js"></script>
</body>
</html>
